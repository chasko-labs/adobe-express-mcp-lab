<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Firefly Tic-Tac-Toe</title>
  </head>
  <body style="font-family: system-ui; padding: 16px">
    <h3>Firefly Tic-Tac-Toe</h3>
    <p>
      Generative board — reuses <code>aws-builder-banner</code> pattern but
      calls <code>generateHost</code> (Firefly) instead of static rects.
    </p>
    <button id="gen">Generate Host Board</button>
    <button id="clear">Clear</button>
    <script type="module">
      import addOnUISdk from "https://new.express.adobe.com/static/add-on-sdk/sdk.js";
      await addOnUISdk.ready;
      const sb = await addOnUISdk.instance.runtime.getApi("documentSandbox");
      document.getElementById("gen").onclick = () =>
        sb.generateHost({
          prompt: "Sumerian tic-tac-toe board, clay texture, 3x3 grid",
        });
      document.getElementById("clear").onclick = () => sb.clearArtboard();
    </script>
  </body>
</html>
